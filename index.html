<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LEVEL UP - Мой путь</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Lobster&display=swap" rel="stylesheet">
<style>
  :root{--amber:#ffa726;--amber2:#ffcc70;--txt:#f4ece4;--mut:rgba(244,236,228,.58);--glass:rgba(26,18,13,.58);--line:rgba(255,176,90,.28);--line2:rgba(255,255,255,.08)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#0d0a08;overflow:hidden;font-family:Manrope,system-ui,sans-serif;color:var(--txt);-webkit-tap-highlight-color:transparent;user-select:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
  .bgfill{position:fixed;inset:-40px;width:calc(100% + 80px);height:calc(100% + 80px);object-fit:cover;filter:blur(30px) brightness(.45)}

  .stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);aspect-ratio:720/1214;
    width:max(100vw, calc(100svh * 720 / 1214));height:auto;container-type:size;overflow:hidden}
  @media (min-aspect-ratio:3/4){.stage{height:100svh;width:auto}}
  .stage video,.heroimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .stage video{opacity:0;transition:opacity .6s ease}
  .stage video.show{opacity:1}
  .heroimg{display:none}.fallback video{display:none}.fallback .heroimg{display:block}
  video::-webkit-media-controls,video::-webkit-media-controls-start-playback-button,video::-webkit-media-controls-overlay-play-button{display:none!important;-webkit-appearance:none}
  .shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.4),rgba(0,0,0,.1) 45%,transparent 60%)}

  .ui{position:absolute;inset:0;font-size:2.6cqw;transition:opacity .35s, transform .35s}
  .ui.hide{opacity:0;transform:translateY(-1.5cqw);pointer-events:none}
  .abs{position:absolute;left:14%;right:14%}
  .glassy{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}

  /* header (always visible) */
  .hdr{position:absolute;left:14%;right:14%;top:3.2%;display:flex;align-items:center;justify-content:space-between;z-index:5}
  .logo{display:flex;align-items:center;gap:1.2cqw;font-weight:800;font-size:3.6cqw;letter-spacing:.04em}
  .logo svg{width:5cqw;height:5cqw}
  .right{display:flex;align-items:center;gap:2.6cqw}
  .bell{position:relative;width:5cqw;height:5cqw;display:grid;place-items:center}
  .bell svg{width:4.4cqw;height:4.4cqw}
  .bdot{position:absolute;right:.2cqw;top:.1cqw;width:1.4cqw;height:1.4cqw;border-radius:50%;background:var(--amber);box-shadow:0 0 2cqw var(--amber)}
  .bdot.off{display:none}
  .pill{display:flex;align-items:center;gap:1.8cqw;padding:.8cqw 2cqw .8cqw .8cqw;border-radius:99px}
  .ava{width:6.4cqw;height:6.4cqw;border-radius:50%;background:linear-gradient(135deg,#b07a52,#5a3a26);display:grid;place-items:center;font-weight:800;font-size:2.8cqw}
  .pill b{display:block;font-size:2.8cqw;line-height:1.15}.pill i{font-style:normal;color:var(--amber);font-size:2.3cqw;font-weight:700}
  .pill .chev{width:2.4cqw;height:2.4cqw;stroke:var(--txt);fill:none;stroke-width:2.4;opacity:.7;margin-left:.6cqw}

  /* title + steps */
  .ttl{top:11%;display:flex;justify-content:space-between;align-items:baseline}
  .ttl h1{font-size:4.8cqw;font-weight:700}
  .ttl .pct{font-size:5.2cqw;font-weight:800}
  .steps{top:16.4%;height:7.6%}
  .track{position:absolute;left:10%;right:10%;top:2cqw;height:.55cqw;background:rgba(255,255,255,.14);border-radius:9px}
  .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--amber2),var(--amber));border-radius:9px;box-shadow:0 0 2cqw rgba(255,167,38,.7);transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
  .dots{position:absolute;inset:0;display:flex;justify-content:space-between}
  .st{width:20%;display:flex;flex-direction:column;align-items:center;gap:1.3cqw;text-align:center;font-size:2cqw;line-height:1.2;color:var(--mut)}
  .st .d{width:4.6cqw;height:4.6cqw;border-radius:50%;border:.45cqw solid rgba(255,255,255,.3);background:#1b140f;display:grid;place-items:center;transition:.3s}
  .st.done .d{background:var(--amber);border-color:var(--amber2)}
  .st.done .d svg{width:2.6cqw;height:2.6cqw;stroke:#2a1a08;stroke-width:3.4;fill:none}
  .st.done,.st.cur{color:var(--txt)}
  .st.cur .d{border-color:var(--amber);animation:pulse 1.8s infinite}
  .st.cur .d:after{content:"";width:1.8cqw;height:1.8cqw;border-radius:50%;background:var(--amber)}
  .st.pick .d{transform:scale(1.15)}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,167,38,.6)}50%{box-shadow:0 0 0 1.4cqw rgba(255,167,38,0)}}
  .hint{top:24.4%;text-align:center;font-size:2.1cqw;color:var(--amber2);opacity:0;transition:.3s;min-height:3cqw}
  .hint.show{opacity:1}

  /* round menu */
  .btns{top:27.4%;display:flex;justify-content:space-between}
  .rb{width:19.5%;display:flex;flex-direction:column;align-items:center;gap:1.3cqw;font-size:2.05cqw;font-weight:600;text-align:center;line-height:1.2}
  .rb .c{width:10.8cqw;height:10.8cqw;border-radius:50%;display:grid;place-items:center;
    background:radial-gradient(circle at 50% 30%,rgba(70,50,35,.75),rgba(25,18,13,.75));border:1px solid var(--line);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:transform .2s, box-shadow .3s, border-color .3s}
  .rb svg{width:5.2cqw;height:5.2cqw;stroke:var(--amber2);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .rb.on .c,.rb:hover .c{border-color:var(--amber);box-shadow:0 0 3cqw rgba(255,167,38,.5), inset 0 0 2cqw rgba(255,167,38,.22)}
  .rb:active .c{transform:scale(.9)}

  /* recommended bar - its bottom edge is where the finger taps */
  .bar{top:44.2%;height:7.3%;display:flex;align-items:stretch;border-radius:3cqw;overflow:visible}
  .bi{flex:1;min-width:0;position:relative;display:flex;align-items:center;gap:1.4cqw;padding:0 1.4cqw 0 1.8cqw;border-radius:3cqw;transition:background .25s, box-shadow .3s}
  .bi + .bi{border-left:1px solid var(--line2);border-radius:0 3cqw 3cqw 0}
  .bi:first-child{border-radius:3cqw 0 0 3cqw}
  .bi:active,.bi.press{background:rgba(255,167,38,.14);box-shadow:inset 0 0 0 1.5px var(--amber),0 0 4cqw rgba(255,167,38,.45)}
  .bi .ic{flex:none;width:5.6cqw;height:5.6cqw;border-radius:1.4cqw;display:grid;place-items:center;border:1px solid var(--line);color:var(--amber2);font-weight:800;font-size:2.5cqw}
  .bi .ic svg{width:4.6cqw;height:4.6cqw;stroke:var(--amber2);fill:none;stroke-width:1.6;stroke-linecap:round}
  .bi b{display:block;font-size:2.1cqw;line-height:1.2;white-space:nowrap}
  .bi small{color:var(--mut);font-size:1.65cqw;white-space:nowrap}
  .bi .go{margin-left:auto;width:2.2cqw;height:2.2cqw;stroke:var(--txt);fill:none;stroke-width:2.2;opacity:.7;flex:none}
  .tag{position:absolute;top:-1.8cqw;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:1.8cqw;font-weight:700;padding:.3cqw 1.8cqw;border-radius:99px;background:var(--amber);color:#2a1a08}
  .doneTag{color:#7bd88a!important}

  .ripple{position:absolute;left:63%;top:51.5%;width:0;height:0;pointer-events:none;z-index:4}
  .ripple span{position:absolute;width:11cqw;height:11cqw;margin:-5.5cqw;border-radius:50%;border:2px solid var(--amber2);opacity:0}
  .ripple.go span{animation:rip .9s ease-out forwards}
  .ripple.go span:nth-child(2){animation-delay:.15s}
  @keyframes rip{0%{opacity:.9;transform:scale(.2)}100%{opacity:0;transform:scale(1.6)}}

  /* panels (stay above the hero: top 11% - 51.5%) */
  .panel{position:absolute;left:14%;right:14%;top:11%;height:40.5%;border-radius:3cqw;padding:2.4cqw;display:flex;flex-direction:column;gap:1.6cqw;
    opacity:0;transform:translateY(2cqw) scale(.98);pointer-events:none;transition:.35s;z-index:6;box-shadow:0 -1px 0 rgba(255,170,80,.5),0 0 5cqw rgba(255,140,40,.12)}
  .panel.open{opacity:1;transform:none;pointer-events:auto}
  .ph{display:flex;align-items:center;gap:1.8cqw;font-size:3.6cqw;font-weight:700}
  .ph button{width:4.6cqw;height:4.6cqw;display:grid;place-items:center;border-radius:50%}
  .ph button:active{background:rgba(255,167,38,.15)}
  .ph svg{width:3.4cqw;height:3.4cqw;stroke:var(--txt);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .pb{flex:1;overflow:auto;display:flex;flex-direction:column;gap:1.2cqw;scrollbar-width:none}
  .pb::-webkit-scrollbar{display:none}
  .row{display:flex;align-items:center;gap:1.6cqw;padding:1.3cqw 1.6cqw;border-radius:2cqw;border:1px solid var(--line2);background:rgba(255,255,255,.03);font-size:2.2cqw;transition:.2s}
  button.row:active{transform:scale(.98)}
  button.row:hover{border-color:var(--line)}
  .row .ic{flex:none;width:6cqw;height:6cqw;border-radius:1.6cqw;display:grid;place-items:center;border:1px solid var(--line);color:var(--amber2);font-weight:800;font-size:2.6cqw}
  .row .ic svg{width:4cqw;height:4cqw;stroke:var(--amber2);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .row small{display:block;color:var(--mut);font-size:1.9cqw}
  .row .r{margin-left:auto;font-size:1.9cqw;color:var(--mut);white-space:nowrap}
  .row.dis{opacity:.45;pointer-events:none}
  .badge{font-size:1.7cqw;font-weight:700;padding:.3cqw 1.4cqw;border-radius:99px;background:rgba(255,167,38,.18);color:var(--amber2);border:1px solid var(--line)}
  .badge.g{background:rgba(76,175,80,.18);color:#9be2a6;border-color:rgba(110,200,130,.4)}
  .chips{display:flex;gap:1.2cqw;flex-wrap:wrap}
  .chip{font-size:2cqw;padding:.8cqw 2cqw;border-radius:99px;border:1px solid var(--line2);color:var(--mut)}
  .chip.on{color:#2a1a08;background:var(--amber2);border-color:var(--amber2);font-weight:700}
  .btn{align-self:flex-start;font-size:2.3cqw;font-weight:700;padding:1.4cqw 3.4cqw;border-radius:99px;background:linear-gradient(90deg,var(--amber2),var(--amber));color:#2a1a08;box-shadow:0 0 3cqw rgba(255,167,38,.4)}
  .btn:active{transform:scale(.96)}
  .btn.ghost{background:none;color:var(--amber2);border:1px solid var(--line);box-shadow:none}
  .muted{color:var(--mut);font-size:2.1cqw;line-height:1.4}

  /* quiz */
  .qbar{display:flex;gap:1cqw}.qbar i{flex:1;height:.9cqw;border-radius:9px;background:rgba(255,255,255,.12)}.qbar i.on{background:var(--amber)}
  .q{font-size:3cqw;font-weight:700;line-height:1.3}
  .opt{padding:1.6cqw 2cqw;border-radius:2cqw;border:1px solid var(--line2);background:rgba(255,255,255,.03);font-size:2.4cqw;transition:.2s}
  .opt:hover{border-color:var(--line)}
  .opt.ok{border-color:#6ec882;background:rgba(76,175,80,.2)}
  .opt.bad{border-color:#e0705a;background:rgba(200,70,50,.2)}
  .res{display:flex;flex-direction:column;align-items:center;text-align:center;gap:1.4cqw;padding-top:2cqw}
  .res .big{font-size:7cqw;font-weight:800;color:var(--amber2);text-shadow:0 0 3cqw rgba(255,167,38,.6)}

  /* chat */
  .msg{max-width:84%;padding:1.4cqw 2cqw;border-radius:2.2cqw;font-size:2.3cqw;line-height:1.35;background:rgba(255,255,255,.06);border:1px solid var(--line2);animation:pop .3s}
  .msg.me{align-self:flex-end;background:rgba(30,120,80,.55);border-color:rgba(110,200,140,.35)}
  @keyframes pop{from{opacity:0;transform:translateY(1cqw)}}
  .typing{display:flex;gap:.8cqw;padding:1.6cqw 2cqw}.typing i{width:1.2cqw;height:1.2cqw;border-radius:50%;background:var(--mut);animation:blink 1s infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes blink{50%{opacity:.25}}
  .cin{display:flex;gap:1.2cqw}
  .cin input{flex:1;min-width:0;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:99px;color:var(--txt);font:inherit;font-size:2.3cqw;padding:1.3cqw 2.4cqw;outline:none}
  .cin button{width:6.4cqw;height:6.4cqw;border-radius:50%;background:var(--amber);display:grid;place-items:center}
  .cin svg{width:3cqw;height:3cqw;stroke:#2a1a08;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

  /* rating */
  .rk{display:grid;grid-template-columns:3.4cqw 4.8cqw 1fr 15cqw 6cqw;align-items:center;gap:1.4cqw;padding:.8cqw 1.4cqw;border-radius:2cqw;border:1px solid var(--line2);background:rgba(255,255,255,.03);font-size:2.3cqw}
  .rk.top{border-color:var(--amber);box-shadow:0 0 2.4cqw rgba(255,167,38,.3)}
  .rk.me{border-color:rgba(110,200,140,.5);background:rgba(76,175,80,.1)}
  .rk .n{font-weight:800;text-align:center}
  .rk .a{width:4.8cqw;height:4.8cqw;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:2.2cqw;background:linear-gradient(135deg,#8a6a52,#3a2a20)}
  .rk small{display:block;color:var(--amber);font-size:1.8cqw;font-weight:700}
  .rk .pb2{height:1cqw;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}.rk .pb2 i{display:block;height:100%;background:linear-gradient(90deg,var(--amber2),var(--amber))}
  .rk .v{text-align:right;font-weight:700}

  .xp{position:absolute;pointer-events:none;font-weight:800;color:var(--amber2);font-size:3.2cqw;text-shadow:0 0 2cqw rgba(255,167,38,.8);animation:xp 1.3s ease-out forwards;z-index:9}
  @keyframes xp{0%{opacity:0;transform:translateY(0) scale(.8)}20%{opacity:1;transform:translateY(-2cqw) scale(1.1)}100%{opacity:0;transform:translateY(-9cqw)}}

  .intro .st,.intro .rb,.intro .bar,.intro .ttl{opacity:0;transform:translateY(1.5cqw)}
  .st,.rb,.bar,.ttl{transition:opacity .5s, transform .5s}

  /* ===== minimal: no containers ===== */
  body{text-shadow:0 1px 8px rgba(0,0,0,.65)}
  .glassy{background:none;border:0;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none}
  .pill{padding:0;gap:1.4cqw}.pill .chev{display:none}
  .shade{background:linear-gradient(180deg,rgba(8,5,3,.55),rgba(8,5,3,.18) 40%,transparent 58%);transition:background .4s}
  .stage.popen .shade{background:linear-gradient(180deg,rgba(8,5,3,.86),rgba(8,5,3,.72) 42%,rgba(8,5,3,.2) 55%,transparent 62%)}
  .rb .c{background:none;border:0;backdrop-filter:none;-webkit-backdrop-filter:none;width:9cqw;height:7cqw;position:relative}
  .rb svg{width:6cqw;height:6cqw;stroke:var(--txt);stroke-width:1.4;filter:drop-shadow(0 1px 4px rgba(0,0,0,.7));transition:.25s}
  .rb.on .c,.rb:hover .c{box-shadow:none}
  .rb.on svg,.rb:hover svg{stroke:var(--amber2);filter:drop-shadow(0 0 2cqw rgba(255,167,38,.7))}
  .rb.on .c:after{content:"";position:absolute;left:50%;bottom:-.6cqw;width:1cqw;height:1cqw;margin-left:-.5cqw;border-radius:50%;background:var(--amber);box-shadow:0 0 1.4cqw var(--amber)}
  .rb{color:var(--mut)}.rb.on{color:var(--txt)}
  .st .d{background:transparent}
  .bar{border-radius:0}
  .bi,.bi:first-child,.bi+.bi{border-radius:0;padding:0 1.2cqw}
  .bi+.bi{border-left:1px solid rgba(255,255,255,.14)}
  .bi:active,.bi.press{background:none;box-shadow:none}
  .bi.press b,.bi:active b{color:var(--amber2);text-shadow:0 0 2.4cqw rgba(255,167,38,.9)}
  .bi .ic{border:0;width:auto;height:auto;font-size:3cqw}
  .bi .ic svg{width:5cqw;height:5cqw}
  .tag{position:static;transform:none;display:block;background:none;color:var(--amber);padding:0;font-size:1.6cqw;letter-spacing:.06em;text-transform:uppercase;margin-bottom:.3cqw}
  .bi .txt{display:flex;flex-direction:column}
  .lower{transition:opacity .5s, transform .5s}
  .ui.clear .lower{opacity:0;transform:translateY(-1cqw);pointer-events:none}
  .panel{background:none;border:0;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none;padding:0;top:11.5%}
  .row,.opt,.rk{background:none;border:0;border-bottom:1px solid rgba(255,255,255,.09);border-radius:0;padding:1.4cqw .2cqw}
  .row .ic{border:0;width:4.6cqw;height:auto}
  .row.dis{opacity:.4}
  .badge{background:none;border:0;padding:0;color:var(--amber2);font-size:1.9cqw}
  .badge.g{background:none;color:#8fdc9c}
  .chips{gap:3cqw;border-bottom:1px solid rgba(255,255,255,.09)}
  .chip{border:0;border-radius:0;padding:.8cqw 0;color:var(--mut);margin-bottom:-1px}
  .chip.on{background:none;color:var(--txt);font-weight:700;border-bottom:2px solid var(--amber)}
  .btn{background:none;color:var(--amber2);box-shadow:none;padding:1cqw 0;font-size:2.4cqw}
  .btn:after{content:" →"}
  .btn.ghost{border:0}
  .opt{text-align:left}
  .opt:hover{border-color:rgba(255,167,38,.5)}
  .opt.ok{background:none;color:#8fdc9c;border-color:#6ec882}
  .opt.bad{background:none;color:#ff9d84;border-color:#e0705a}
  .rk.top{box-shadow:none;border-color:rgba(255,167,38,.5)}.rk.top span{color:var(--amber2)}
  .rk.me{background:none;border-color:rgba(110,200,140,.5)}
  .rk .a{background:none;border:1px solid rgba(255,255,255,.2)}
  .msg{background:none;border:0;padding:.6cqw 0;max-width:92%}
  .msg.me{background:none;color:var(--amber2);text-align:right}
  .cin input{background:none;border:0;border-bottom:1px solid rgba(255,255,255,.2);border-radius:0;padding:1.2cqw 0}
  .cin button{background:none;width:auto}.cin svg{stroke:var(--amber2)}
  .qbar i{height:.5cqw}

  /* birds: shadows only show up on the lit window patch (multiply) */
  @keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.5)}}

  /* ===== Windows-style slim progress bar ===== */
  .xpwrap{top:11.2%;transition:opacity .3s}
  .pxrow{display:flex;align-items:center;gap:1.6cqw;font-size:2.1cqw;color:var(--mut);margin-bottom:.9cqw}
  .pxlbl{color:var(--txt);font-weight:600}
  .pxpct{margin-left:auto;color:var(--txt);font-weight:700;font-variant-numeric:tabular-nums}
  .pxhide{width:3.4cqw;height:3.4cqw;display:grid;place-items:center;border-radius:.6cqw;color:var(--mut);font-size:2.6cqw;line-height:1}
  .pxhide:hover{color:var(--txt);background:rgba(255,255,255,.08)}
  .xpbar{height:1.9cqw;padding:.28cqw;border:1px solid #6f7378;border-radius:.55cqw;background:linear-gradient(#fdfdfd,#e4e6e8);box-shadow:inset 0 1px 1px rgba(0,0,0,.25);overflow:hidden;cursor:pointer}
  .xpbar i,.pxmini i{display:block;height:100%;width:0;border-radius:.2cqw;transition:width 1.2s cubic-bezier(.2,.8,.2,1);
    background:repeating-linear-gradient(90deg,transparent 0 1.05cqw,#f4f5f6 1.05cqw 1.35cqw),linear-gradient(180deg,#b9f5b0 0%,#43c940 40%,#24a524 60%,#62d85c 100%)}
  .pxmini{position:absolute;left:14%;right:14%;top:10.2%;height:.9cqw;padding:.12cqw;border:1px solid #6f7378;border-radius:.4cqw;background:#eceef0;opacity:0;pointer-events:none;transition:opacity .3s;overflow:hidden}
  .ui.pxoff .xpwrap{opacity:0;pointer-events:none}
  .ui.pxoff .pxmini{opacity:.85;pointer-events:auto}
  .btns{top:18.2%;transition:top .4s, opacity .5s, transform .5s}

    border:.8cqw solid #09090a;
    box-shadow:0 0 0 1px rgba(255,255,255,.07),inset 0 0 0 1px rgba(0,0,0,.6),0 2.4cqw 5cqw rgba(0,0,0,.6),0 0 14cqw 1cqw rgba(255,140,50,.16)}
  .tv:before{content:"";position:absolute;inset:0;border-radius:.6cqw;background:linear-gradient(115deg,transparent 55%,rgba(255,255,255,.035) 56%,transparent 70%)}

  .xpwrap{top:10.9%}

  .bar{top:27.4%;height:6.8%}
  .ui.pxoff .btns{top:12.4%}
  .ui.pxoff .bar{top:23.4%}
  .pxmini{left:15.4%;right:15.4%;top:9.9%}
  .panel{left:15.4%;right:15.4%}
  .rb{font-size:1.85cqw}

  /* ===== first-person view: sections open on a sheet of paper in your hands ===== */
  .stage video,.heroimg{transition:opacity .6s ease, transform 1s cubic-bezier(.3,.7,.2,1), filter 1s ease;transform-origin:22% 72%}

  .fpvig{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1s;background:radial-gradient(90% 70% at 50% 55%,transparent 40%,rgba(0,0,0,.55))}
  .stage.fp .fpvig{opacity:1}

  .panel{--txt:#2b2119;--mut:rgba(43,33,25,.58);--amber:#d98a16;--amber2:#b0680a;--line2:rgba(0,0,0,.1);
    left:14.6%!important;right:14.6%!important;top:17%!important;bottom:auto;height:auto!important;min-height:56%;max-height:78%;padding:6cqw 4.6cqw 4.4cqw!important;

    box-shadow:0 4cqw 8cqw rgba(0,0,0,.6),0 1cqw 2cqw rgba(0,0,0,.35),inset 0 0 6cqw rgba(160,120,70,.12)!important;
    transform:perspective(900px) translateY(55cqw) rotateX(38deg) rotate(4deg) scale(.86)!important;transform-origin:50% 100%;
    transition:opacity .45s, transform .75s cubic-bezier(.2,.8,.2,1)!important}
  .panel.open{transform:perspective(900px) rotate(-1.4deg)!important;transition-delay:.25s!important}
  .panel:after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:.5;
    background:repeating-linear-gradient(0deg,rgba(120,90,50,.025) 0 2px,transparent 2px 5px)}
  .clip{position:absolute;right:9%;top:-3.4cqw;width:4.6cqw;height:11cqw;z-index:2;filter:drop-shadow(0 .4cqw .4cqw rgba(0,0,0,.35))}
  .panel .ph{font-size:4.6cqw;font-weight:800;letter-spacing:-.01em}
  .panel .ph svg{stroke:var(--txt)}
  .panel .ph button:active{background:rgba(0,0,0,.06)}
  .panel .row,.panel .opt,.panel .rk{border-bottom:1px solid rgba(0,0,0,.09)}
  .panel .row{padding:1.8cqw .4cqw;font-size:2.5cqw}

  .panel .opt{border:1px solid rgba(0,0,0,.13);border-radius:2.2cqw;padding:2cqw 2.4cqw;margin-bottom:.6cqw;background:rgba(255,255,255,.55);font-size:2.6cqw}
  .panel .opt:hover{border-color:#d98a16}
  .panel .opt.ok{background:linear-gradient(#ffe2ad,#f6c46a);border-color:#d98a16;color:#3a2610}
  .panel .opt.bad{background:#f5cfc6;border-color:#d96b55;color:#5a1f12}
  .panel .q{font-size:3.4cqw}
  .panel .btn{background:linear-gradient(#6e4729,#472c18);color:#f7ead8;padding:1.8cqw 4.4cqw;border-radius:99px;box-shadow:0 .8cqw 1.6cqw rgba(60,35,15,.35)}
  .panel .btn.ghost{background:none;color:#6e4729;box-shadow:none;border:1px solid rgba(110,71,41,.4)}
  .panel .badge{color:#b0680a}.panel .badge.g{color:#2e8b3e}
  .panel .chips{border-bottom:1px solid rgba(0,0,0,.1)}
  .panel .chip.on{color:var(--txt);border-bottom-color:#d98a16}
  .panel .rk .a{border-color:rgba(0,0,0,.2)}
  .panel .rk .pb2{background:rgba(0,0,0,.1)}
  .panel .rk.top span{color:#b0680a}
  .panel .rk.me{border-color:rgba(46,139,62,.5)}

  .panel .cin input::placeholder{color:var(--mut)}
  .panel .cin svg{stroke:#b0680a}
  .panel .qbar i{background:rgba(0,0,0,.1)}.panel .qbar i.on{background:#e39a2a}
  .panel .res .big{color:#b0680a;text-shadow:none}
  .panel .typing i{background:rgba(0,0,0,.4)}

  /* ===== top-down desk (first person), same order as in the scene ===== */
  .desk{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:0;overflow:hidden;
    background:radial-gradient(55% 35% at 12% 10%,rgba(255,200,120,.38),transparent 70%),
      repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 .4cqw,transparent .4cqw 3.1cqw),
      repeating-linear-gradient(90deg,rgba(255,220,170,.035) 0 1.2cqw,transparent 1.2cqw 7.3cqw),
      linear-gradient(180deg,#6b4429,#4f311d 60%,#3d2616);
    transform:perspective(1200px) rotateX(62deg) translateY(-22%) scale(1.3);transform-origin:50% 0;
    transition:opacity .55s ease .15s, transform 1.05s cubic-bezier(.3,.7,.2,1)}
  .stage.fp .desk{opacity:1;transform:none}
  .wallstrip{position:absolute;left:0;right:0;top:0;height:2.2%;background:linear-gradient(180deg,#140d09,#2a1b12);box-shadow:0 .6cqw 1.2cqw rgba(0,0,0,.5)}
  .wallstrip:after{content:"";position:absolute;left:12%;right:12%;bottom:0;height:2px;background:linear-gradient(90deg,transparent,rgba(255,170,80,.6),transparent)}
  .desk .it{position:absolute;filter:drop-shadow(0 .6cqw .8cqw rgba(0,0,0,.35))}
  .phone{width:12cqw;height:23cqw;border-radius:2.6cqw;background:#121419;padding:1cqw;box-shadow:0 1cqw 2cqw rgba(0,0,0,.5)}
  .phone .scr{width:100%;height:100%;border-radius:1.8cqw;background:linear-gradient(180deg,#25304a,#141a28);display:flex;flex-direction:column;align-items:center;padding-top:3cqw;gap:2cqw;color:#fff;text-shadow:none}
  .phone b{font-size:2.9cqw;font-weight:800}
  .phone span{font-size:1.25cqw;line-height:1.3;background:rgba(255,255,255,.88);color:#222;border-radius:1cqw;padding:.8cqw 1cqw;width:84%}
  .stage.fp .fpvig{background:radial-gradient(85% 65% at 50% 50%,transparent 45%,rgba(0,0,0,.5))}
  .fpvig{z-index:5}
  .panel{z-index:6;top:26.5%!important;height:47.5%!important;min-height:0!important;max-height:none!important;left:20.5%!important;right:20.5%!important;padding:5.2cqw 3.8cqw 3.6cqw!important}
  .hand{position:absolute;top:67%;width:32cqw;height:44.8cqw;z-index:7;pointer-events:none;opacity:0;transition:opacity .4s, transform .8s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 1cqw 1.4cqw rgba(0,0,0,.4))}
  .hl{left:17%;transform:translateY(30cqw) rotate(6deg)}
  .hr{right:17%;transform:translateY(30cqw) scaleX(-1) rotate(6deg)}
  .stage.fp .panel.open ~ .hl{opacity:1;transform:rotate(6deg);transition-delay:.4s}
  .stage.fp .panel.open ~ .hr{opacity:1;transform:scaleX(-1) rotate(6deg);transition-delay:.4s}

  /* ===== no TV: big desktop icons right on the wall ===== */
  .xpwrap{top:9.4%;right:24%!important}
  .pxmini{top:8.6%;right:24%!important}
  .icons{top:15%!important;display:grid!important;grid-template-columns:repeat(3,1fr);row-gap:3.4cqw;justify-items:center}
  .ui.pxoff .icons{top:11%!important}
  .icons .rb{width:auto;font-size:2.6cqw;font-weight:600;color:var(--txt);gap:1cqw;padding:1cqw 1.4cqw 1.2cqw;border-radius:1cqw;border:1px solid transparent;transition:background .2s,border-color .2s}
  .icons .rb .c{width:16.8cqw!important;height:15.6cqw!important}
  .icons .rb.on .c:after{display:none}
  .icons .rb.hov,.icons .rb:hover{background:rgba(120,170,255,.16);border-color:rgba(150,190,255,.45)}
  .icons .rb.hov .c svg.wi,.icons .rb:hover .c svg.wi{transform:translateY(-.6cqw)}
  .icons .rb.dbl .c svg.wi{animation:dbl .35s ease}
  @keyframes dbl{40%{transform:scale(.88)}100%{transform:none}}
  .cursor{position:absolute;left:0;top:0;width:4.6cqw;height:4.6cqw;z-index:4;pointer-events:none;filter:drop-shadow(.3cqw .5cqw .4cqw rgba(0,0,0,.5));
    transition:transform 1.4s cubic-bezier(.45,.05,.25,1),opacity .4s;transform:translate(50cqw,40cqw)}
  .cursor.click{animation:clk .3s}
  @keyframes clk{50%{scale:.85}}
  .cursor.off{opacity:0}

  /* ===== profile corner (top-right, like a page corner) ===== */
  .corner{position:fixed;top:0;right:0;width:clamp(112px,34vmin,210px);aspect-ratio:1;z-index:20;
    pointer-events:none;background:none;border:0;padding:0}
  .corner:before{content:"";position:absolute;inset:0;clip-path:polygon(18% 0,100% 0,100% 82%);background:
      repeating-linear-gradient(115deg,rgba(255,255,255,.07) 0 2px,transparent 2px 7px),
      linear-gradient(225deg,#ff8a3d,#e8562a 55%,#c9421d);filter:drop-shadow(-4px 4px 8px rgba(0,0,0,.45))}
  .cava,.clvl{pointer-events:auto;cursor:pointer}

  .cava{position:absolute;right:7%;top:6%;width:40%;aspect-ratio:1;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.35),0 4px 10px rgba(0,0,0,.35);display:grid;place-items:center;overflow:hidden}
  .cava span{display:block;width:84%;height:84%;margin-top:14%}
  .clvl{position:absolute;left:73%;top:44%;transform:translateX(-50%);font:800 clamp(9px,2.3vmin,13px)/1 Manrope,system-ui;color:#c9421d;background:#fff;padding:3px 7px;border-radius:99px;box-shadow:0 2px 6px rgba(0,0,0,.3);white-space:nowrap}
  .stage.fp ~ .corner{opacity:0;pointer-events:none}

  /* ===== perks sliding out of the right edge ===== */
  .perks{position:fixed;right:0;top:0;bottom:0;width:0;z-index:19}
  .perk{position:absolute;right:0;width:clamp(90px,26vmin,170px);cursor:pointer;transform:translateX(110%) rotate(var(--r,0deg));transition:transform .7s cubic-bezier(.2,1.3,.4,1);filter:drop-shadow(-3px 5px 6px rgba(0,0,0,.45))}
  .perk.in{transform:translateX(42%) rotate(var(--r,0deg))}
  .perk.in:hover{transform:translateX(30%) rotate(var(--r,0deg))}
  .perk.got{transition:transform .6s ease-in, opacity .6s;transform:translate(-40%,-60vh) scale(.4) rotate(20deg);opacity:0}
  .toast2{position:fixed;left:50%;bottom:9%;transform:translate(-50%,20px);opacity:0;z-index:21;pointer-events:none;transition:.35s;
    background:rgba(20,13,9,.88);color:#f4ece4;font:600 clamp(12px,3.4vmin,16px)/1.3 Manrope,system-ui;padding:10px 16px;border-radius:99px;border:1px solid rgba(255,176,90,.35);white-space:nowrap}

  .birds{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply}

  .bird{position:absolute;left:0;top:0;filter:blur(1.5px);opacity:.72;will-change:transform}
  .bird svg{display:block;width:100%;height:100%;fill:#4a230c;animation:flap .3s ease-in-out infinite alternate;transform-origin:50% 60%}

  /* profile: just the avatar icon with the name under it */
  .corner{width:auto;aspect-ratio:auto;top:12px;right:12px;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:auto}
  .corner:before{display:none}
  .cava{position:static;width:clamp(44px,12.5vmin,64px);box-shadow:0 0 0 2px rgba(255,255,255,.25),0 4px 12px rgba(0,0,0,.45)}
  .cname{font:700 clamp(11px,3vmin,14px)/1 Manrope,system-ui;color:#f4ece4;text-shadow:0 1px 6px rgba(0,0,0,.7)}
  /* progress bar almost edge to edge */
  .xpwrap{top:12.4%;left:12.6%!important;right:12.6%!important}
  .pxmini{top:11.8%;left:12.6%!important;right:12.6%!important}
  .icons{top:19%!important}
  .ui.pxoff .icons{top:14.5%!important}
  .xpwrap{top:4.6%!important}
  .pxmini{top:4.2%!important}
  .icons{top:11.4%!important}
  .ui.pxoff .icons{top:7.4%!important}
  svg.wi.px{image-rendering:pixelated}

  /* little pixel hero standing where the progress stopped */
  .xpwrap{overflow:visible}
  .runner{position:absolute;left:0;bottom:1.7cqw;width:5.2cqw;height:7.1cqw;transform:translateX(-50%);transition:left 1.2s cubic-bezier(.2,.8,.2,1);pointer-events:none;filter:drop-shadow(0 .3cqw .3cqw rgba(0,0,0,.45));animation:bob 1.6s steps(2) infinite}

  @keyframes fa{0%{opacity:1}50%{opacity:0}}
  @keyframes fb{0%{opacity:0}50%{opacity:1}}
  @keyframes bob{50%{translate:0 -.3cqw}}

  /* ===== rating: a scroll that unrolls ===== */
  .panel.scrollmode{background:radial-gradient(ellipse at 50% 0,rgba(255,255,255,.3),transparent 55%),linear-gradient(90deg,#cfb27a,#efdcb2 10%,#f4e6c3 50%,#efdcb2 90%,#cfb27a)!important;
    border-radius:0!important;padding:6.4cqw 4cqw 6.4cqw!important;box-shadow:0 3cqw 5cqw rgba(0,0,0,.5)!important;overflow:visible}
  .panel.scrollmode .clip{display:none}
  .panel.scrollmode:before,.panel.scrollmode:after{content:"";position:absolute;left:-3.4cqw;right:-3.4cqw;height:3.6cqw;border-radius:1.8cqw;opacity:1;z-index:3;
    background:radial-gradient(circle at 1.8cqw 50%,#d9a650 0 1.2cqw,transparent 1.3cqw),radial-gradient(circle at calc(100% - 1.8cqw) 50%,#d9a650 0 1.2cqw,transparent 1.3cqw),linear-gradient(180deg,#a06a36,#6b4020 45%,#3d220f);
    box-shadow:0 .8cqw 1.4cqw rgba(0,0,0,.45);inset:auto}
  .panel.scrollmode:before{top:-1.6cqw;left:-3.4cqw;right:-3.4cqw}
  .panel.scrollmode:after{bottom:-1.6cqw;left:-3.4cqw;right:-3.4cqw}
  .panel.scrollmode.unroll{animation:unroll 1.1s cubic-bezier(.3,.7,.2,1) .35s both}
  .panel.scrollmode.unroll:after{animation:rodDown 1.1s cubic-bezier(.3,.7,.2,1) .35s both}
  @keyframes unroll{from{clip-path:inset(-3cqw -5cqw calc(100% - 3cqw) -5cqw)}to{clip-path:inset(-3cqw -5cqw -4cqw -5cqw)}}
  @keyframes rodDown{from{transform:translateY(calc(-1 * (47.5cqh - 2cqw)))}to{transform:none}}
  .sr{display:grid;grid-template-columns:3.6cqw 7.4cqw 1fr auto;align-items:center;gap:1.6cqw;padding:1.1cqw .4cqw;border-bottom:1px dashed rgba(110,70,30,.25)}
  .sr .sn{font-weight:900;font-size:2.8cqw;text-align:center}
  .sr .ph2{width:7.4cqw;height:7.4cqw;border-radius:50%;overflow:hidden;box-shadow:0 0 0 .45cqw #fff,0 0 0 .7cqw rgba(110,70,30,.35)}
  .sr .ph2 svg{display:block;width:100%;height:100%}
  .sr .nm{font-weight:700;font-size:2.5cqw}.sr .nm small{display:block;color:#b0680a;font-size:1.8cqw;font-weight:700}
  .sr .pt{text-align:right}.sr .pt b{display:block;font-size:2.8cqw;font-weight:900}.sr .pt small{font-size:1.6cqw;color:var(--mut)}
  .sr.top{background:linear-gradient(90deg,rgba(224,160,32,.18),transparent)}
  .sr.me{background:rgba(46,139,62,.12);border-bottom:0}

  /* ===== 8 apps on the wall, 4 per row ===== */
  .icons{grid-template-columns:repeat(4,1fr)!important;row-gap:2.6cqw!important}
  .icons .rb{font-size:2.2cqw!important;padding:.8cqw .6cqw 1cqw!important;white-space:nowrap}
  .icons .rb .c{width:12.6cqw!important;height:11.8cqw!important}
  /* wallet pill + lofi toggle in the progress row */
  .wpill{display:flex;align-items:center;gap:.7cqw;font:800 2.1cqw/1 Manrope,system-ui;color:#ffd45a;background:rgba(0,0,0,.35);padding:.5cqw 1.3cqw .5cqw .6cqw;border-radius:99px;margin-left:auto;pointer-events:auto}

  .lofi{position:relative}
  .pxpct{margin-left:0!important}
  /* ===== Paydax: phone app over the phone-in-hands scene ===== */
  .ppay{position:absolute;left:19.6%;width:64.6%;top:15.2%;height:69.6%;transform:rotate(-1.2deg);transform-origin:50% 50%;display:none;flex-direction:column;
    background:#0b0f14;color:#e8edf2;border-radius:7.7cqw;overflow:hidden;font-family:Manrope,system-ui;pointer-events:auto}
  .pscene.pay .pchat,.pscene.pay .pin,.pscene.pay .psend{display:none!important}
  .pscene.pay.ready .ppay{display:flex}

/* ---------- split-flap board animation ---------- */
const FL_ABC = 'АБВГДЕЖЗИКЛМНОПРСТУФХЦЧШЫЭЮЯ', FL_NUM = '0123456789';
function flipCell(el, delay){
  const target = el.dataset.c, pool = /\d/.test(target) ? FL_NUM : FL_ABC;
  let n = target === ' ' ? 2 : 5 + Math.floor(Math.random() * 7);
  setTimeout(function step(){
    const old = el.textContent, flap = document.createElement('span'); flap.className = 'flap'; flap.textContent = old;
    el.textContent = n > 1 ? pool[Math.floor(Math.random() * pool.length)] : target;
    el.appendChild(flap); setTimeout(() => flap.remove(), 75);
    if (--n > 0) setTimeout(step, 65);
  }, delay);
}
function flipAll(root){
  root.querySelectorAll('.btl, .br, #pTitle').forEach((r, ri) => r.querySelectorAll('.fl').forEach((c, ci) => flipCell(c, ri * 90 + ci * 35)));

const FACE = ["....HHHH....","..HHHHHHHH..",".HHHHHHHHHH.",".HHSSSSSSHH.",".HSSESSESSH.",".HSSSSSSSSH.","..SSSMMSSS..","...SSSSSS...","..CCCCCCCC..",".CCCCCCCCCC.","CCCCCCCCCCCC","CCCCCCCCCCCC"];
const LOOK = {
  'Данияр':{H:'#1d130c',S:'#e7b48a',C:'#2f6fd0'}, 'Алина':{H:'#2b1a10',S:'#f2c7a2',C:'#d64f7a',long:1},
  'Мадияр':{H:'#3a2416',S:'#d9a274',C:'#3a9a52'}, 'Аружан':{H:'#120c08',S:'#eab88f',C:'#7a5ad0',long:1},
  'Тимур':{H:'#5a3720',S:'#e3ad80',C:'#e0921f'}, 'Азат':{H:'#2b1a10',S:'#ecb88e',C:'#cdb594'}
};
function pxFace(name){
  const L = LOOK[name] || LOOK['Тимур'];
  const pal = {H:L.H, S:L.S, E:'#1b1410', M:'#b0704a', C:L.C};
  let r = '';
  FACE.forEach((row, y) => { for (let x = 0; x < 12; x++){ let c = row[x];
    if (L.long && c === '.' && y >= 3 && y <= 8 && (x === 0 || x === 11 || x === 1 || x === 10)) c = 'H';
    if (c !== '.') r += `<rect x="${x}" y="${y}" width="1" height="1" fill="${pal[c]}"/>`; } });
  return `<svg viewBox="0 0 12 12" shape-rendering="crispEdges"><rect width="12" height="12" fill="#e9dcc0"/>${r}</svg>`;
}

let stack = [];
function open(name, arg, push = true){
  if (name === 'ai'){ if (panel.classList.contains('open')) close(); openPhone('ai'); return; }
  if (name === 'tests' && push){ if (panel.classList.contains('open')) close(); showWheel(); return; }
  if (name === 'testsList') name = 'tests';
  if (name === 'shop'){ if (panel.classList.contains('open')) close(); openShop(arg); return; }
  if (name === 'rating'){ if (panel.classList.contains('open')) close(); openBoard(arg); return; }
  if (name === 'pay'){ if (panel.classList.contains('open')) close(); openPhone('pay'); return; }
  if (name === 'opps' || name === 'opp'){ if (panel.classList.contains('open')) close(); openLaptop(); return; }
  if (push) stack.push([name, arg]);
  const v = VIEWS[name](arg);
  $('pTitle').textContent = v.title;
  $('pBody').innerHTML = v.html;
  $('pBody').scrollTop = 0;
  const wasScroll = panel.classList.contains('scrollmode');
  const MODE = {rating:'boardmode', opps:'laptopmode', opp:'laptopmode', ai:'phonemode'}[name] || '';
  panel.classList.remove('laptopmode','phonemode','boardmode'); if (MODE) panel.classList.add(MODE);
  panel.classList.toggle('scrollmode', MODE === 'scrollmode');
  $('stage').classList.toggle('m-lap', MODE === 'laptopmode'); $('stage').classList.toggle('m-phn', MODE === 'phonemode');
  panel.classList.add('open'); ui.classList.add('hide'); $('stage').classList.add('popen','fp'); if (cur==='D'||cur==='C') switchTo('W');
  v.after && v.after();
  document.querySelectorAll('.rb').forEach(b => b.classList.toggle('on', b.dataset.open === name));
}
function back(){ stack.pop(); if (stack.length){ const [n, a] = stack[stack.length-1]; open(n, a, false); } else close(); }
function close(){ stack = []; panel.classList.remove('open'); ui.classList.remove('hide'); $('stage').classList.remove('popen','fp','m-lap','m-phn'); document.querySelectorAll('.rb').forEach(b => b.classList.toggle('on', b.dataset.open === 'tests')); }

const DIRS = ['Frontend-разработка','Data / AI','Product / Marketing','Backend-разработка'];

const VIEWS = {
  tests: () => ({ title:'Тесты', html: Object.entries(TESTS).map(([k, t]) =>
    `<button class="row ${t.soon?'dis':''}" data-quiz="${k}"><span class="ic">${ICON[t.ic] || WICON[t.ic]}</span><span>${t.name}<small>${t.sub}</small></span>
     <span class="r">${state.done[k] ? '<span class="badge g">Пройден</span>' : t.soon ? 'скоро' : k==='prof' ? '<span class="badge">Рекомендуем</span>' : 'Начать'}</span></button>`).join('') }),

  quiz: ({k, i = 0, score = 0, ans = []}) => {
    const t = TESTS[k];
    if (i >= t.qs.length){
      let big, line;
      if (k === 'en'){ big = `${score}/${t.qs.length}`; line = `Уровень: <b>${['A1','A2','B1','B2'][score]}</b>. Добавили в план курс английского под твой уровень.`; }
      else if (k === 'prof'){ big = DIRS[ans[0]]; line = 'Подобрали стажировки и курсы под это направление. Загляни в «Возможности».'; }
      else { big = `${score}/${t.qs.length}`; line = score === t.qs.length ? 'Идеально! Навык прокачан, он отмечен в Жеке спэйс.' : 'Хорошее начало. Разбор ответов уже в твоём плане.'; }
      return { title: t.name, html: `<div class="res"><div class="muted">Тест пройден</div><div class="big" style="font-size:${k==='prof'?4.4:7}cqw">${big}</div><div class="muted">${line}</div><div class="badge" style="font-size:2.2cqw">+20 XP</div>
        <div style="display:flex;gap:1.6cqw;margin-top:1cqw"><button class="btn" data-close>На главную</button>${k==='prof'?'<button class="btn ghost" data-open="opps">Возможности</button>':''}</div></div>`,
        after: () => finishTest(k) };
    }
    const [q, opts, right] = t.qs[i];
    return { title: t.name, html: `<div class="qbar">${t.qs.map((_, n) => `<i class="${n<=i?'on':''}"></i>`).join('')}</div>
      <div class="muted">Вопрос ${i+1} из ${t.qs.length}</div><div class="q">${q}</div>
      ${opts.map((o, n) => `<button class="opt" data-ans="${n}">${o}</button>`).join('')}`,
      after: () => document.querySelectorAll('[data-ans]').forEach(b => b.onclick = () => {
        const n = +b.dataset.ans; let sc = score;
        if (right !== undefined){ b.classList.add(n === right ? 'ok' : 'bad'); if (n !== right) document.querySelector(`[data-ans="${right}"]`).classList.add('ok'); else sc++; }
        else b.classList.add('ok');
        document.querySelectorAll('[data-ans]').forEach(x => x.style.pointerEvents = 'none');
        setTimeout(() => { stack[stack.length-1] = ['quiz', {k, i:i+1, score:sc, ans:[...ans, n]}]; open('quiz', {k, i:i+1, score:sc, ans:[...ans, n]}, false); }, 650);
      }) };
  },

  ai: () => ({ title:'AI Ассистент', html: `<div class="day-chip">Сегодня</div>
      <div class="msg">Привет, Азат! 👋<br>Я твой AI ассистент в Level Up.<span class="tm">${hm()}</span></div>
      <div class="msg">Чем могу помочь сегодня?<span class="tm">${hm()}</span></div>
      <div id="chat" style="display:contents"></div>
      <div id="sugg" class="sugg">
        <button data-ask="test"><span class="ic">${ICON.chart}</span>Пройдём короткий тест на интересы и навыки?<b>›</b></button>
        <button data-ask="intern"><span class="ic">${ICON.case}</span>Подберу стажировки и программы?<b>›</b></button>
        <button data-ask="plan"><span class="ic">${ICON.tasks}</span>Составлю план развития в IT?<b>›</b></button>
      </div>
      <form class="cin" id="cin"><span class="plus">+</span><input id="cinput" placeholder="Сообщение..." maxlength="120"><button aria-label="Отправить"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></form>`,
    after: () => {
      document.querySelectorAll('[data-ask]').forEach(b => b.onclick = () => ask(b.dataset.ask, b.textContent.replace('›','').trim()));

  opps: (f = 'Стажировки') => {

        <div class="obtns"><button class="ob no" id="oNo">✕</button><span class="ocount">${idx + 1} из ${list.length}</span><button class="ob yes" id="oYes">♥</button></div>`
      : `<div class="oend"><div class="big">Всё просмотрено ✓</div><div class="muted">Сохранено: ${Object.keys(state.applied).length}</div><button class="btn" id="oAgain">Смотреть заново</button></div>`;
    return { title:'Возможности', html: `<div class="chips">${Object.keys(OPPS).map(k => `<button class="chip ${k===f?'on':''}" data-filter="${k}">${k}</button>`).join('')}</div>${deck}`,
      after: () => {
        document.querySelectorAll('[data-filter]').forEach(b => b.onclick = () => { stack[stack.length-1] = ['opps', b.dataset.filter]; open('opps', b.dataset.filter, false); });
        if (!o){ $('oAgain').onclick = () => { state.oppIdx[f] = 0; open('opps', f, false); }; return; }
        const card = $('ocard');
        const fly = dir => {
          card.style.transition = 'transform .45s ease-in, opacity .45s'; card.style.transform = `translateX(${dir * 120}%) rotate(${dir * 18}deg)`; card.style.opacity = 0;
          if (dir > 0){ state.applied[o.co + o.role] = true; addXp(5); toast2(`♥ <b>${o.co}</b> - сохранено в работу`); }
          setTimeout(() => { state.oppIdx[f] = idx + 1; open('opps', f, false); }, 380);
        };
        $('oNo').onclick = () => fly(-1); $('oYes').onclick = () => fly(1);
        let sx = null, dx = 0, moved = false;
        card.addEventListener('pointerdown', e => { sx = e.clientX; dx = 0; moved = false; card.setPointerCapture(e.pointerId); card.style.transition = 'none'; });
        card.addEventListener('pointermove', e => { if (sx === null) return; dx = e.clientX - sx; if (Math.abs(dx) > 6) moved = true;
          card.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`; card.classList.toggle('lyes', dx > 40); card.classList.toggle('lno', dx < -40); });
        card.addEventListener('pointerup', () => { const w = card.offsetWidth; sx = null;
          if (dx > w * .28) fly(1); else if (dx < -w * .28) fly(-1);
          else { card.style.transition = 'transform .3s'; card.style.transform = ''; card.classList.remove('lyes','lno'); if (!moved) open('opp', o); } });
      } };
  },

  opp: (o) => ({ title: o.co, html: `<div class="odet" style="--c:${o.c}"><div class="otype">${o.type}</div><div class="orole big2">${o.role}</div>

// the laptop video slowly zooms in and the lid is slightly tilted:
// the screen overlay is mapped onto the 4 corners of the lid glass (perspective transform), frame by frame
const LKEY = [ // t, TL, TR, BL, BR  (fractions of the stage)
  [0,    [.146,.247],[.878,.239],[.164,.523],[.883,.511]],
  [5,    [.076,.210],[.903,.199],[.097,.548],[.919,.521]],
  [9.75, [.025,.189],[.944,.175],[.042,.560],[.958,.527]]];
function cornersAt(t){
  let k = t <= LKEY[1][0] ? 0 : 1; const a = LKEY[k], b = LKEY[k + 1];
  const f = Math.min(1, Math.max(0, (t - a[0]) / (b[0] - a[0])));
  return [1,2,3,4].map(n => [a[n][0] + (b[n][0] - a[n][0]) * f, a[n][1] + (b[n][1] - a[n][1]) * f]);
}
function solve(A, B){ const n = B.length;
  for (let c = 0; c < n; c++){ let m = c; for (let r = c + 1; r < n; r++) if (Math.abs(A[r][c]) > Math.abs(A[m][c])) m = r;
    [A[c], A[m]] = [A[m], A[c]]; [B[c], B[m]] = [B[m], B[c]];
    for (let r = 0; r < n; r++){ if (r === c) continue; const q = A[r][c] / A[c][c]; for (let k = c; k < n; k++) A[r][k] -= q * A[c][k]; B[r] -= q * B[c]; } }
  return B.map((v, r) => v / A[r][r]); }
function quadMatrix(w, h, P){
  const S = [[0,0],[w,0],[0,h],[w,h]], A = [], B = [];
  for (let i = 0; i < 4; i++){ const [x, y] = S[i], [u, v] = P[i];
    A.push([x, y, 1, 0, 0, 0, -u * x, -u * y]); B.push(u);
    A.push([0, 0, 0, x, y, 1, -v * x, -v * y]); B.push(v); }
  const [a, b, c, d, e, f, g, hh] = solve(A, B);
  return `matrix3d(${a},${d},0,${g},${b},${e},0,${hh},0,0,1,0,${c},${f},0,1)`;
}

    lscr.style.width = bw + 'px'; lscr.style.height = bh + 'px';
    const P = cornersAt(vL.currentTime || 0).map(([x, y]) => [x * W, y * H]);
    const [TL, TR, BL, BR] = P;
    const ux = ((TR[0]-TL[0]) + (BR[0]-BL[0])) / 2 / bw, uy = ((TR[1]-TL[1]) + (BR[1]-BL[1])) / 2 / bw;
    const vx = ((BL[0]-TL[0]) + (BR[0]-TR[0])) / 2 / bh, vy = ((BL[1]-TL[1]) + (BR[1]-TR[1])) / 2 / bh;

    lscr.style.transform = `matrix(${ux},${uy},${vx},${vy},${cx - (ux*bw + vx*bh)/2},${cy - (uy*bw + vy*bh)/2})`;
  }

})();

  sboard.innerHTML = `<div class="ssign"><div class="neon">Дукенчик</div><div class="neon2">LEVEL UP</div><span class="bl"><span class="wc">${WICON.coin}</span>${fmt(W.bal)} ф</span><p>Нажми на подсказку в зале,<br>чтобы открыть полку</p></div>`;
}
function openShop(cat){
  if (!SHOP[cat]){ shopSign(); stage.classList.add('smode'); return; }
  sscene.classList.add('open');
  SHOPCAT = cat;
  const items = SHOP[SHOPCAT], pics = SPIC[SHOPCAT];
  const shelves = []; for (let i = 0; i < items.length; i += 3) shelves.push(items.slice(i, i + 3).map((it, j) => [it, i + j]));
  sboard.innerHTML = `<div class="sh"><div class="sh1"><button class="sback" data-sx="back"><svg viewBox="0 0 48 28"><path d="M23 3.5v21a1.6 1.6 0 0 1-2.5 1.3L4.3 15.3a1.6 1.6 0 0 1 0-2.6L20.5 2.2A1.6 1.6 0 0 1 23 3.5zM45 3.5v21a1.6 1.6 0 0 1-2.5 1.3L26.3 15.3a1.6 1.6 0 0 1 0-2.6L42.5 2.2A1.6 1.6 0 0 1 45 3.5z"/></svg><i>вернуться</i></button>
      <b>Магазин</b><button class="sbal" data-sx="pay"><span class="wc">${WICON.coin}</span>${fmt(W.bal)} ф</button></div>
      <div class="stabs">${Object.keys(SHOP).map(k => `<button class="${k === SHOPCAT ? 'on' : ''}" data-sx="cat:${k}">${k}</button>`).join('')}</div></div>
    <div class="shelves">${shelves.map(row => `<div class="shelf">${row.map(([[n, , pr], i]) => `<button class="itm ${W.bal < pr ? 'no' : ''}" data-sx="it:${i}"><span class="pic">${spic(pics[i] || 'star')}</span><span class="nm">${n}</span><span class="tag">${fmt(pr)} ф</span></button>`).join('')}</div>`).join('')}</div>
    <div class="sdet" id="sdet"></div>`;
  stage.classList.add('smode');
}
sboard.addEventListener('click', e => {
  const b = e.target.closest('[data-sx]'); if (!b) return;
  const [cmd, arg] = b.dataset.sx.split(/:(.*)/);
  if (cmd === 'back'){ shopSign(); return; }
  if (cmd === 'pay'){ stage.classList.remove('smode'); setTimeout(() => open('pay'), 500); return; }
  if (cmd === 'cat'){ openShop(arg); return; }
  if (cmd === 'close'){ $('sdet').classList.remove('on'); return; }
  if (cmd === 'it'){ const [n, sub, pr] = SHOP[SHOPCAT][+arg];
    $('sdet').innerHTML = `<span class="pic">${spic(SPIC[SHOPCAT][+arg] || 'star')}</span><span><b>${n}</b><small>${sub}</small>
      <button class="buy" data-sx="buy:${arg}">${W.bal < pr ? `Не хватает ${fmt(pr - W.bal)} ф` : `Купить за ${fmt(pr)} ф`}</button></span><button class="x" data-sx="close">×</button>`;
    $('sdet').classList.add('on'); return; }
  if (cmd === 'buy'){ const [n, , pr] = SHOP[SHOPCAT][+arg];
    if (W.bal < pr){ stage.classList.remove('smode'); setTimeout(() => { open('pay'); }, 500); toast2('Заработай фунты в Paydax'); return; }
    spend(pr, n); state.perks = state.perks || []; state.perks.push(n); toast2(`🛍 <b>${n}</b> - в Жеке спэйс`); openShop(SHOPCAT); }
});
$('sExit').onclick = () => stage.classList.remove('smode');
/* ---------- aquarium: fish swim on their own ---------- */
(function(){ const v = document.querySelector('.aq-water video'); if (!v) return;
  v.addEventListener('playing', () => v.classList.add('on'));
  const go = () => v.play().catch(() => {}); go(); ['pointerdown','touchstart'].forEach(ev => addEventListener(ev, go, {once:true, passive:true})); })();
(function(){
  const box = $('aqFish'); if (!box) return;
  const KINDS = [['big',.44,.045],['s1',.14,.07],['s2',.18,.065],['s3',.22,.06],['mint1',.13,.08],['mint2',.14,.075],['red',.17,.07],['pur1',.15,.07],['s1',.13,.075],['mint1',.12,.085]];
  const F = KINDS.map(([k, h, sp], i) => { const el = document.createElement('div'); el.className = 'f'; el.style.height = (h * 100) + '%';
    el.innerHTML = `<img src="fish/${k}.png" alt="" style="--tw:${(.55 + Math.random() * .6).toFixed(2)}s">`; box.appendChild(el);
    return {el, h, sp: sp * (.8 + Math.random() * .4), x: Math.random(), y: .18 + Math.random() * .6, dir: Math.random() < .5 ? 1 : -1, ph: Math.random() * 6, by: 0, turn: 0, w: 0}; });
  let last = performance.now(), W = 0, H = 0;
  const size = () => { const r = box.getBoundingClientRect(); W = r.width; H = r.height; F.forEach(f => { const im = f.el.firstChild; f.w = im.naturalWidth ? im.naturalWidth / im.naturalHeight * f.h * H : f.h * H * 1.6; }); };
  addEventListener('resize', size); F.forEach(f => f.el.firstChild.onload = size); size();
  (function step(t){
    const dt = Math.min(.05, (t - last) / 1000); last = t;
    if (W && !document.hidden){
      F.forEach(f => {
        f.turn -= dt;
        if (f.turn <= 0 && Math.random() < dt * .08){ f.dir *= -1; f.turn = 3; }
        f.x += f.dir * f.sp * dt;
        const ww = f.w / W;
        if (f.x > 1 + ww * .2){ f.dir = -1; f.y = .15 + Math.random() * .62; }
        if (f.x < -ww * 1.2){ f.dir = 1; f.y = .15 + Math.random() * .62; }
        f.by += (f.y - f.by) * dt * .6;
        const yy = (f.by + Math.sin(t / 1000 * 1.1 + f.ph) * .04) * H - f.h * H / 2;
        f.el.style.transform = `translate(${f.x * W}px,${yy}px) scaleX(${f.dir})`;
      });
    }
    requestAnimationFrame(step);
  })(last);
  F.forEach(f => f.by = f.y);
})();

/* ---------- Rating: giant board on the atrium wall ---------- */
const bwall = $('bwall');
function openBoard(f = 'Общий'){
  const v = VIEWS.rating(f), d = new Date();
  const tmp = document.createElement('div'); tmp.innerHTML = v.html;
  const chips = tmp.querySelector('.bchips').outerHTML; tmp.querySelector('.bchips').remove();
  bwall.innerHTML = `<div class="bh btl">${[...'РЕЙТИНГ'].map(c => `<span class="fl" data-c="${c}" style="background:#0a0b0d;color:#ffd23f"> </span>`).join('')}
      <span class="live">LIVE</span><span class="clk">${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}</span></div>
    ${chips}<div class="bcol"><span>МЕСТО</span><span>УЧАСТНИК</span><span>LVL</span><span>БАЛЛЫ</span></div><div class="brows">${tmp.innerHTML}</div>`;
  bwall.querySelectorAll('[data-rf]').forEach(b => b.onclick = () => { bwall.querySelectorAll('[data-rf]').forEach(x => x.classList.toggle('on', x === b)); openBoard(b.dataset.rf, true); });
  if (!stage.classList.contains('bmode')){ stage.classList.add('bmode'); setTimeout(() => flipAll(bwall), 1500); }
  else flipAll(bwall);
}
function closeBoard(){ stage.classList.remove('bmode'); }
$('pBackBoard').onclick = closeBoard;
/* ---------- Wheel of fortune with prize pictures ---------- */
const TW = ['en','prof','soft','logic','fin','it','kz','leader'];
const wheel = $('wheel'), wrap = $('wheelwrap'), hub = $('whub'); let giftT, wRot = 0;
const WN = TW.length, WA = 360 / WN;
wheel.style.background = `repeating-conic-gradient(from 0deg,#ffd45a 0 ${WA}deg,#ff9a3c ${WA}deg ${WA * 2}deg)`;
function wLabel(k){ return TESTS[k].name.replace('IT-грамотность','IT').replace('Финграмотность','Финансы').replace('Тест на английский','Английский').replace('Профориентация','Профессия'); }
wheel.innerHTML = TW.map((k, i) => `<div class="sl" style="transform:rotate(${i * WA + WA / 2}deg)"><div style="transform:rotate(${-(i * WA + WA / 2)}deg)">${WICON[TESTS[k].ic]}${wLabel(k)}</div></div>`).join('');
const wLbls = [...wheel.querySelectorAll('.sl > div')];
function showWheel(){ hub.disabled = false; hub.textContent = 'КРУТИТЬ'; wrap.classList.add('on'); }
function hideWheel(){ wrap.classList.remove('on'); }
$('wx').onclick = () => hideWheel();
$('wList').onclick = () => { hideWheel(); setTimeout(() => open('testsList'), 300); };
function confetti(){
  const C = ['#ffa726','#ffd45a','#3cc455','#3d8be8','#ee4a36','#c9a5ff','#ffffff'];
  for (let i = 0; i < 70; i++){
    const c = document.createElement('div'); c.className = 'confetti'; c.style.background = C[i % C.length];
    const sz = 6 + Math.random() * 8; c.style.width = c.style.height = sz + 'px';
    document.body.appendChild(c);
    const a = Math.random() * Math.PI * 2, r = 120 + Math.random() * 260;
    c.animate([{transform:'translate(-50%,-50%) rotate(0)', opacity:1},
               {transform:`translate(calc(-50% + ${Math.cos(a) * r}px), calc(-50% + ${Math.sin(a) * r - 80}px)) rotate(${Math.random()*540}deg)`, opacity:1, offset:.6},
               {transform:`translate(calc(-50% + ${Math.cos(a) * r * 1.1}px), calc(-50% + ${Math.sin(a) * r + 260}px)) rotate(${Math.random()*720}deg)`, opacity:0}],
      {duration:1400 + Math.random() * 600, easing:'cubic-bezier(.2,.7,.4,1)'}).onfinish = () => c.remove();
  }
}
hub.onclick = () => {
  if (hub.disabled) return; hub.disabled = true; hub.textContent = '...';
  const all = TW.map((k, i) => [k, i]), left = all.filter(([k]) => !state.done[k]), pool = left.length ? left : all;
  const [k, idx] = pool[Math.floor(Math.random() * pool.length)];
  const target = 360 - (idx * WA + WA / 2) + (Math.random() * WA * .5 - WA * .25);
  wRot += 360 * 6 + ((target - wRot % 360) + 360) % 360;
  wheel.style.transition = 'transform 5.2s cubic-bezier(.12,.8,.18,1)'; wheel.style.transform = `rotate(${wRot}deg)`;
  wLbls.forEach((d, i) => d.style.transform = `rotate(${-(i * WA + WA / 2) - wRot}deg)`);
  setTimeout(() => {
    confetti(); wrap.classList.remove('on'); const t = TESTS[k];
    $('surprise').innerHTML = `<div class="scard"><div class="k">Колесо тестов · выпало</div><div class="e">${WICON[t.ic]}</div><h3>${t.name}</h3><p>${t.sub}<br>За прохождение +20 XP и +2 000 фунтов</p>
      <button id="takeGift">Начать тест</button><button id="reSpin" style="background:none;color:#5a3a22;margin-top:6px">крутить ещё раз</button></div>`;
    $('takeGift').onclick = () => { $('surprise').innerHTML = ''; open('quiz', {k}); };
    $('reSpin').onclick = () => { $('surprise').innerHTML = ''; showWheel(); };
  }, 5400);
};
if (location.hash === '#open=tests') setTimeout(() => { history.replaceState(null, '', location.pathname); showWheel(); }, 900);
// wheel paused for now: giftT = setTimeout(showWheel, 12000);

/* ---------- splash screen between pages ---------- */
(function(){
  const sp = document.createElement('div'); sp.id = 'splash'; document.body.appendChild(sp);
  let came = false; try { came = sessionStorage.getItem('lu_splash') === '1'; sessionStorage.removeItem('lu_splash'); } catch(e){}
  if (came){ sp.style.transition = 'none'; sp.classList.add('on'); requestAnimationFrame(() => { sp.style.transition = ''; setTimeout(() => sp.classList.remove('on'), 650); }); }
  window.goSplash = url => { try { sessionStorage.setItem('lu_splash','1'); } catch(e){} sp.classList.add('on'); setTimeout(() => location.href = url, 900); };
})();
